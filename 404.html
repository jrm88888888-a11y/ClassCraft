<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — ClassCraft</title>
  <meta name="description" content="The page you're looking for doesn't exist. Head back to ClassCraft for free GCSE and A-Level revision resources." />
  <link rel="stylesheet" href="style.css" />
  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 70vh;
      padding: 4rem 1.25rem;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 300;
      line-height: 1;
      color: var(--parchment-deep);
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
    }
    .error-page h1 {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      margin-bottom: 1rem;
    }
    .error-page p {
      color: var(--ink-mid);
      max-width: 42ch;
      margin: 0 auto 2rem;
      font-size: 1rem;
      line-height: 1.7;
    }
    .error-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
  </style>
</head>
<body>

<div id="nav-slot"></div>

<main>
  <div class="error-page">
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>The page you were looking for doesn't seem to exist. It may have been moved or the link might be outdated.</p>
    <div class="error-links">
      <a href="index.html" class="btn btn-accent">Back to Home</a>
      <a href="games.html" class="btn">Browse Games</a>
    </div>
  </div>
</main>

<div id="footer-slot"></div>

<script src="nav.js"></script>

</body>
</html>
