    .hd-back{font-size:0.6rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:rgba(245,239,230,0.45);text-decoration:none;}
    .hd-back:hover{color:var(--p);}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:0.5rem;padding:0.5rem;flex:1;min-height:0;overflow:hidden;}
    .tile{background:var(--pm);border:1px solid var(--pd);border-top:3px solid var(--acc);padding:0.7rem 0.9rem;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
    .lbl{font-size:0.65rem;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--acc);margin-bottom:0.25rem;white-space:nowrap;flex-shrink:0;}

    .rans{display:none;font-family:var(--fd);font-size:clamp(1.4rem,2.2vw,2.4rem);color:var(--acc);font-weight:400;margin-top:0.3rem;line-height:1.15;flex-shrink:0;}

function doy(){const n=new Date(),s=new Date(n.getFullYear(),0,0);return Math.floor((n-s)/86400000)-1;}
function pick(arr){return arr[doy()%arr.length];}
