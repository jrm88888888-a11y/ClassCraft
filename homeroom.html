<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homeroom A — MartinEdu</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Archivo:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:#1c1712; --ink-mid:#4a3f33; --ink-light:#8a7a6a;
      --p:#f5efe6; --pm:#ede4d6; --pd:#e0d3c0;
      --acc:#8b5e3c; --accl:#c4956a;
      --fd:'Cormorant Garamond',Georgia,serif;
      --fb:'Archivo',Helvetica,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;background:var(--p);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;}

    .page{display:flex;flex-direction:column;height:100vh;}

    /* Header */
    .hd{background:var(--ink);color:var(--p);padding:0.5rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .hd-logo{font-family:var(--fd);font-size:1.3rem;color:var(--p);text-decoration:none;}
    .hd-logo span{color:var(--accl);}
    .hd-centre{display:flex;flex-direction:column;align-items:center;gap:0.1rem;}
    .hd-date{font-family:var(--fd);font-size:1.2rem;color:rgba(245,239,230,0.9);}
    .hd-switch{font-size:0.6rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:rgba(245,239,230,0.5);text-decoration:none;border:1px solid rgba(245,239,230,0.2);padding:0.2rem 0.6rem;transition:all 0.2s;}
    .hd-switch:hover{color:var(--p);border-color:rgba(245,239,230,0.5);}
    .hd-back{font-size:0.6rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:rgba(245,239,230,0.45);text-decoration:none;}
    .hd-back:hover{color:var(--p);}

    /* 4×3 grid */
    .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:0.65rem;padding:0.65rem;flex:1;min-height:0;overflow:hidden;}

    /* Tile */
    .tile{background:var(--pm);border:1px solid var(--pd);border-top:3px solid var(--acc);padding:0.9rem 1.1rem;display:flex;flex-direction:column;overflow:hidden;min-height:0;}

    /* Typography */
    .lbl{font-size:0.65rem;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--acc);margin-bottom:0.4rem;white-space:nowrap;flex-shrink:0;}
    .main{font-family:var(--fd);font-size:clamp(1.6rem,2.5vw,2.8rem);font-weight:400;line-height:1.15;color:var(--ink);flex-shrink:0;}
    .pos{font-size:clamp(0.8rem,1vw,1rem);color:var(--ink-light);font-style:italic;margin-top:0.2rem;flex-shrink:0;}
    .body{font-size:clamp(0.85rem,1.1vw,1.15rem);color:var(--ink-mid);line-height:1.45;margin-top:0.4rem;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;}
    .foot{font-size:clamp(0.72rem,0.9vw,0.9rem);color:var(--ink-light);margin-top:auto;padding-top:0.4rem;border-top:1px solid rgba(139,94,60,0.18);flex-shrink:0;}

    /* Reveal */
    .rbtn{font-family:var(--fb);font-size:0.68rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;background:var(--ink);color:var(--p);border:none;padding:0.4rem 1rem;cursor:pointer;margin-top:0.5rem;align-self:flex-start;flex-shrink:0;transition:background 0.2s;}
    .rbtn:hover{background:var(--acc);}
    .rans{display:none;font-family:var(--fd);font-size:clamp(1.4rem,2.2vw,2.4rem);color:var(--acc);font-weight:400;margin-top:0.3rem;line-height:1.15;flex-shrink:0;}

    /* Specials */
    .flag-img{height:clamp(50px,6vh,80px);width:auto;border:1px solid var(--pd);margin:0.4rem 0;flex-shrink:0;}
    .zh{font-size:clamp(3rem,6vw,5.5rem);line-height:1;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);flex-shrink:0;}
    .elsym{font-family:var(--fd);font-size:clamp(3rem,5.5vw,5rem);font-weight:600;color:var(--acc);line-height:1;flex-shrink:0;}
    .qt{font-family:var(--fd);font-size:clamp(1.1rem,1.7vw,1.8rem);font-style:italic;line-height:1.4;color:var(--ink);flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;}

    /* Colour variants */
    .c1{border-top-color:#4a7ab5;}
    .c2{border-top-color:#a04040;}
    .c3{border-top-color:#7a5aa0;}
    .c4{border-top-color:#8b5e3c;}
    .c5{border-top-color:#4a8a5a;}
    .c6{border-top-color:#3a8a8a;}
  </style>
</head>

  <header class="hd">

    </div>

    <!-- 2. Idiom of the Day -->

      <p class="foot" id="id-example"></p>
    </div>

    <!-- 3. Maths Problem -->
    <div class="tile c1">

      <button class="rbtn" onclick="rev('m-ans',this)">Show Answer</button>
      <p class="rans" id="m-ans"></p>
    </div>

    <!-- 4. Joke of the Day -->
    <div class="tile c4">
      <p class="lbl">😄 Joke of the Day</p>
      <p class="main" id="j-q"></p>
      <button class="rbtn" onclick="rev('j-ans',this)">Punchline</button>
      <p class="rans" id="j-ans"></p>
    </div>

    <!-- 5. Literary Quote -->
    <div class="tile c4">
      <p class="lbl">📚 Literary Quote</p>
      <p class="qt" id="qt-text"></p>
      <p class="foot" id="qt-author"></p>
    </div>

    <!-- 6. On This Day -->
    <div class="tile c5">
      <p class="lbl">📅 On This Day</p>
      <p class="main" style="font-size:clamp(2.5rem,4vw,4.5rem);" id="otd-year"></p>
      <p class="body" id="otd-event"></p>
    </div>

    <!-- 7. Born Today -->
    <div class="tile c2">
      <p class="lbl">🎂 Born Today</p>
      <p class="main" style="font-size:clamp(1.2rem,1.8vw,2rem);" id="born-name"></p>
      <p class="body" id="born-desc"></p>
    </div>

    <!-- 8. Science Fact -->
    <div class="tile c6">
      <p class="lbl">🔬 Science Fact</p>
      <p class="body" style="font-size:clamp(1rem,1.4vw,1.4rem);font-style:normal;color:var(--ink);line-height:1.5;" id="sci"></p>
    </div>

    <!-- 9. Guess the Flag -->
    <div class="tile c6">
      <p class="lbl">🚩 Guess the Flag</p>
      <img class="flag-img" id="flag-img" src="" alt="Flag" />
      <button class="rbtn" onclick="rev('flag-ans',this)">Reveal Country</button>
      <p class="rans" id="flag-ans"></p>
    </div>

    <!-- 10. Name the Element -->
    <div class="tile c5">
      <p class="lbl">⚗️ Name the Element</p>
      <p class="elsym" id="el-sym"></p>
      <p class="pos" id="el-hint"></p>
      <button class="rbtn" onclick="rev('el-ans',this)">Reveal Element</button>
      <p class="rans" id="el-ans"></p>
    </div>

    <!-- 11. French Word -->
    <div class="tile c1">
      <p class="lbl">🇫🇷 French Word of the Day</p>
      <p class="main" id="fr-w"></p>
      <p class="pos" id="fr-pos"></p>
      <p class="body" id="fr-m"></p>
    </div>

    <!-- 12. Chinese Character -->
    <div class="tile c2">
      <p class="lbl">🇨🇳 Chinese Character</p>
      <p class="zh" id="zh-c"></p>
      <p class="pos" id="zh-p"></p>
      <p class="body" id="zh-m"></p>
    </div>

  </div>
</div>

// ── HELPERS ──────────────────────────────────────────────────────────
function doy(){const n=new Date(),s=new Date(n.getFullYear(),0,0);return Math.floor((n-s)/86400000)-1;}
function pick(arr){return arr[doy()%arr.length];}
function rev(id,btn){document.getElementById(id).style.display='block';btn.style.display='none';}
